# Dedicated bridge cluster. No TCP listener or connection password.
listen_addresses = ''
port = 29436
unix_socket_directories = '/run/ecx-postgres'
unix_socket_group = 'ecx-worker'
unix_socket_permissions = 0770
hba_file = '/etc/ecx-bridge/pg_hba.conf'
ident_file = '/etc/ecx-bridge/pg_ident.conf'
max_connections = 24
shared_buffers = '64MB'
password_encryption = 'scram-sha-256'
