[package]
name = "ecx-solana-helper"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.97"

[lib]
name = "ecx_solana_sdk"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-hash = "=3.0.0"
solana-instruction = "=3.0.0"
solana-keypair = "=3.0.1"
solana-message = { version = "=3.0.1", features = ["bincode"] }
solana-pubkey = "=3.0.0"
solana-signer = "=3.0.0"
solana-transaction = { version = "=3.0.0", features = ["bincode", "verify"] }
spl-token-interface = "=3.0.0"
spl-associated-token-account-interface = "=2.0.0"
spl-memo-interface = "=2.0.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[dev-dependencies]
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
