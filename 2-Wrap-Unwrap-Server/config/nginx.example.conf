# Include from nginx's http context. Replace domain, certificate paths and port.
# Direct Internet ingress: do not trust client-supplied forwarding headers.
map "$request_method:$uri" $ecx_order_ip {
    default "";
    ~^POST:/api/v1/orders/*$ $binary_remote_addr;
}
map $ecx_order_ip $ecx_order_global { "" ""; default "orders"; }
limit_req_zone $binary_remote_addr zone=ecx_ip:1m rate=10r/s;
limit_req_zone $server_name zone=ecx_site:1m rate=30r/s;
limit_req_zone $ecx_order_ip zone=ecx_order_ip:1m rate=6r/m;
limit_req_zone $ecx_order_global zone=ecx_orders:1m rate=30r/m;
# No URLs, query strings, authorization headers or request bodies in access logs.
log_format ecx_status '$time_iso8601 $request_method $status $request_time';
server {
    listen 443 ssl;
    server_name bridge.example.invalid;
    ssl_certificate /etc/ecx-proxy/fullchain.pem;
    ssl_certificate_key /etc/ecx-proxy/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/ecx-access.log ecx_status;
    error_log /var/log/nginx/ecx-error.log crit;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    limit_req_status 429;
    limit_req zone=ecx_ip burst=20 nodelay;
    limit_req zone=ecx_site burst=60 nodelay;
    limit_req zone=ecx_order_ip burst=1 nodelay;
    limit_req zone=ecx_orders burst=2 nodelay;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 330s;
        proxy_send_timeout 15s;
    }
}
