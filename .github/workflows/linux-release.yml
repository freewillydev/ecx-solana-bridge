name: Native Linux release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-linux-release
  cancel-in-progress: false
jobs:
  x86-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: 2-Wrap-Unwrap-Server
    env:
      ECX_BUILD_DIR: ${{ github.workspace }}/.release-build
      ECX_BUILD_JOBS: '2'
    steps:
      - name: Reserve capacity on the disposable runner
        working-directory: .
        run: |
          # These image SDKs are unrelated to the pinned bridge toolchains.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /opt/hostedtoolcache
          python3 -c 'import shutil; free=shutil.disk_usage(".").free; print("Free build GiB:", round(free/2**30, 1)); assert free >= 30*2**30, "Insufficient native build space"'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore pinned toolchains
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .release-build/tools
            .release-build/*-linux-*.tar.xz
            .release-build/node-source
            .release-build/sqlite
          key: ubuntu24-x86-tools-notices-v2-${{ hashFiles('2-Wrap-Unwrap-Server/deploy/toolchains.json') }}
      - name: Restore frozen dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .release-build/cabal
            .release-build/cargo
            .release-build/cargo-target
            ~/.npm
          key: ubuntu24-x86-dependencies-${{ hashFiles('cabal.project.freeze', '2-Wrap-Unwrap-Server/solana-helper/Cargo.lock', '2-Wrap-Unwrap-Server/web/package-lock.json') }}
          restore-keys: ubuntu24-x86-dependencies-
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential curl ca-certificates xz-utils pkg-config libgmp-dev libffi-dev libnuma-dev libncurses-dev zlib1g-dev libssl-dev libpq-dev python3 patchelf openssl
      - name: Bootstrap verified toolchains
        run: ECX_BOOTSTRAP_ONLY=1 ./scripts/build-release
      - name: Save verified toolchains before compilation
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .release-build/tools
            .release-build/*-linux-*.tar.xz
            .release-build/node-source
            .release-build/sqlite
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Build, test and package
        id: build
        run: ./scripts/build-release
      - name: Retain dependency cache even after an application failure
        if: always() && !cancelled() && steps.build.outcome != '' && steps.dependencies.outputs.cache-primary-key != '' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .release-build/cabal
            .release-build/cargo
            .release-build/cargo-target
            ~/.npm
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Verify installer checksum
        working-directory: .release-build
        run: sha256sum -c ecx-bridge-ubuntu-24.04-x86_64.run.sha256
      - name: Retain private installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-24.04-x86_64-installer
          path: |
            .release-build/ecx-bridge-ubuntu-24.04-x86_64.run
            .release-build/ecx-bridge-ubuntu-24.04-x86_64.run.sha256
            .release-build/bundle/manifest.json
            .release-build/bundle/dependencies.json
          if-no-files-found: error
          retention-days: 7
